<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>秘术传送门</title>
    
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Microsoft YaHei', sans-serif;
            touch-action: none; 
        }

        #canvas-container { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            z-index: 1; 
            background: #000;
        }

        .input_video { display: none; }

        /* === UI 层 === */
        #ui-layer {
            position: absolute; top: 20px; left: 0; width: 100%; text-align: center; z-index: 10;
            font-family: 'Courier New', Courier, monospace;
            color: #ff3300; 
            font-weight: bold; pointer-events: none;
            text-shadow: 0 0 10px #aa0000; 
            opacity: 0; 
            transition: opacity 1s;
        }
        
        #start-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            text-align: center;
            transition: opacity 0.8s ease;
        }

        #overlay {
            display: inline-block;
            color: rgba(255, 200, 200, 0.95);
            font-size: 16px;
            letter-spacing: 12px;
            cursor: pointer;
            background: rgba(40, 10, 0, 0.7); 
            backdrop-filter: blur(12px);
            padding: 20px 60px;
            border-radius: 100px;
            border: 1px solid rgba(255, 100, 50, 0.3);
            box-shadow: 0 0 30px rgba(255, 50, 0, 0.2);
            transition: transform 0.2s, box-shadow 0.3s;
            font-weight: 300;
            text-transform: uppercase;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }

        #overlay:hover {
            border-color: rgba(255, 100, 0, 0.8);
            box-shadow: 0 0 50px rgba(255, 50, 0, 0.5);
            transform: scale(1.02);
        }
        
        #start-subtext {
            margin-top: 15px;
            font-size: 10px;
            color: rgba(255, 100, 50, 0.6);
            letter-spacing: 1px;
            cursor: pointer;
            text-decoration: none;
            transition: color 0.3s;
        }

        #watermark {
            position: absolute;
            top: 20px; right: 25px;
            font-size: 12px;
            color: rgba(255, 100, 50, 0.5);
            letter-spacing: 2px;
            z-index: 15;
            cursor: pointer;
            font-weight: bold;
            display: none; 
        }

        #end-ad {
            position: absolute;
            bottom: 40px; right: 30px; 
            background: rgba(50, 10, 0, 0.3);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 100, 0, 0.3);
            color: rgba(255, 150, 100, 0.9);
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
            z-index: 15;
            opacity: 0; 
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            display: none; 
        }
        #end-ad.visible {
            opacity: 1;
            transform: translateY(0);
        }



    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="start-container">
        <div id="overlay" onclick="startExperience()">把手放到摄像头前，准备开启传送门</div>
        <div id="start-subtext" onclick="goBuy()">Powered by 七叶怀瑾 | 定制专属文字</div>
    </div>

    <div id="watermark"><a href="https://vimalinx.xyz" target="_blank" style="text-decoration:none;color:inherit">七叶怀瑾</a></div>
    <div id="end-ad" onclick="goBuy()">
        我也要定制专属法阵铭文 <span style="margin-left:8px; opacity:0.7">👉 点击获取专属链接</span>
    </div>

    <div id="ui-layer">
        ENERGY: <span id="energy-val">0</span>% <br>
        <div id="status">INITIALIZING...</div>
    </div>

    <video class="input_video"></video>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';

        // === 1. 配置 ===
        const BUY_LINK = "../#buy"; 
        const API_DECODE_URL = "https://vimalin.xyz:8443/api/decode"; 

        const CONFIG = {
            baseColor: 0xff3300, 
            
            energyRate: 0.00025,    
            decayRate: 0.005,
            autoChargeRate: 0.0001, 
            trailIntensity: 0.22,   
            minSpeed: 0.002,        
            
            // [修改] 提高阈值，让手感变“迟钝”
            distThreshold: 0.20,    // 必须离得比较近(>0.2)才开始响应
            sensitivity: 3.5        
        };

        let runeText = "2026 新年快乐 万事胜意 岁岁平安 所愿皆得  "; 

        let isPaidUser = false;
        let hasStarted = false;
        let hasShownAd = false;
        
        let scene, camera, renderer;
        let spellRoot;
        let components = { rings: [] };
        
        let isHandDetected = false;
        let isHandOpen = false;
        let handProximity = 0;      
        
        let energy = 0;
        let isEnergyLocked = false;
        let currentStage = 0;
        let pulseScale = 0;
        let pressAcce = 0; // [新增] 用来记录长按时的加速度

        // [添加] 这是一个新变量，用来标记是否正在长按屏幕 
        let isLongPressing = false;

        // [新增] 定义一个全局变量来判断是否为移动端 
        const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 900; 

        function updateStartText() { 
            const overlayBtn = document.getElementById('overlay'); 
            if (isPaidUser && overlayBtn.innerText.includes("时光法阵")) { 
                // 如果是定制用户的文案，保留原样，不做修改 
                return; 
            } 
            
            // 如果是普通用户，根据设备修改提示 
            if (isMobileDevice) { 
                overlayBtn.innerText = "长按屏幕 · 开启法阵"; 
                overlayBtn.style.letterSpacing = '4px'; 
            } else { 
                overlayBtn.innerText = "把手放到摄像头前 · 开启法阵"; 
            } 
        }

        // === 2. API 逻辑 ===
        window.goBuy = function() {
            window.location.href = BUY_LINK;
        }

        // === 2. API 逻辑 (带加载锁与魔法文案) === 
        window.goBuy = function() { 
            window.location.href = BUY_LINK; 
        } 

        async function fetchDecryptedPayload() { 
            const params = new URLSearchParams(window.location.search); 
            const code = params.get('code'); 
            const overlayBtn = document.getElementById('overlay'); 
            
            // 只有当存在 code 时，才需要锁定等待 
            if (code) { 
                // --- 1. 锁定按钮，显示魔幻风格加载文案 --- 
                overlayBtn.innerText = "正在解封..."; 
                overlayBtn.style.pointerEvents = "none"; // 禁止点击 
                overlayBtn.style.cursor = "wait"; 
                overlayBtn.style.opacity = "0.8"; 
                
                try { 
                    const response = await fetch(API_DECODE_URL, { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify({ code: code }) 
                    }); 
                    
                    const result = await response.json(); 
                    
                    if (result.success && result.data) { 
                        const payload = result.data; 
                        
                        if (payload.wish || payload.to || payload.from) { 
                            isPaidUser = true; 
                            
                            // 1. 获取称呼 
                            const toUser = payload.to ? payload.to.trim() : ""; 
                            const fromUser = payload.from ? payload.from.trim() : ""; 

                            // 2. 定制按钮文案 
                            if (toUser && fromUser) { 
                                overlayBtn.innerText = `${fromUser} 为 ${toUser} 铭刻的时光法阵`; 
                                overlayBtn.style.fontSize = '14px'; 
                                overlayBtn.style.letterSpacing = '2px'; 
                                overlayBtn.style.padding = '20px 30px'; 
                            } else if (toUser) { 
                                overlayBtn.innerText = `${toUser}，请亲手解开这道封印`; 
                                overlayBtn.style.fontSize = '14px'; 
                                overlayBtn.style.letterSpacing = '2px'; 
                                overlayBtn.style.padding = '20px 30px'; 
                            } else if (fromUser) { 
                                overlayBtn.innerText = `来自 ${fromUser} 的时空秘钥`; 
                                overlayBtn.style.letterSpacing = '4px'; 
                                overlayBtn.style.fontSize = '15px'; 
                            } else { 
                                overlayBtn.innerText = "感应手势，开启秘境"; 
                                overlayBtn.style.letterSpacing = '8px'; 
                            } 

                            // 3. 处理法阵铭文 (Rune Text) 
                            let customText = ""; 
                            if (payload.wish) customText += payload.wish.replace(/\n/g, "  ") + "  "; 
                            
                            if (!customText.trim()) customText = "万事如意 五福临门 妖邪退散 岁岁平安"; 

                            // 补全长度 
                            if(customText.length < 20) customText = customText.repeat(3); 
                            else if(customText.length < 40) customText = customText.repeat(2); 

                            runeText = customText; 
                        } 
                    } else { 
                        // 后端返回成功但无数据，恢复默认指令 
                        updateStartText(); 
                    } 
                } catch (e) { 
                    console.error("API Error:", e); 
                    updateStartText(); // 出错也恢复默认指令 
                } finally { 
                    // --- 4. 解锁按钮 --- 
                    overlayBtn.style.pointerEvents = "auto"; 
                    overlayBtn.style.cursor = "pointer"; 
                    overlayBtn.style.opacity = "1"; 
                    
                    initUI(); 
                } 
            } else { 
                // 没有 code，直接初始化 UI 和默认文本 
                initUI(); 
                updateStartText(); 
            } 
        }

        function initUI() {
            if (isPaidUser) {
                const wm = document.getElementById('watermark');
                if(wm) wm.style.display = 'none';
                const endAd = document.getElementById('end-ad');
                if(endAd) endAd.style.display = 'block'; 
            } else {
                const wm = document.getElementById('watermark');
                if(wm) wm.style.display = 'block';
                const endAd = document.getElementById('end-ad');
                if(endAd) endAd.style.display = 'block';
            }
        }
        
        fetchDecryptedPayload();
        initUI();
        updateStartText();

        // === 3. 纹理生成 ===

        function createRuneTexture() {
            const size = 2048;
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            const cx = size/2; const cy = size/2;

            // 1. Black Background
            ctx.beginPath();
            ctx.arc(cx, cy, size/2 - 10, 0, Math.PI * 2);
            ctx.arc(cx, cy, size/2 - 350, 0, Math.PI * 2, true); 
            ctx.fillStyle = "rgba(0, 0, 0, 0.9)"; 
            ctx.fill();

            const mainColor = "#ff3300";
            
            // 2. 双环结构
            ctx.shadowBlur = 20;
            ctx.shadowColor = "#ff0000";
            ctx.lineWidth = 15;
            ctx.strokeStyle = mainColor;

            // 外环
            ctx.beginPath();
            ctx.arc(cx, cy, size/2 - 40, 0, Math.PI * 2);
            ctx.stroke();

            // 内环
            ctx.beginPath();
            ctx.arc(cx, cy, size/2 - 300, 0, Math.PI * 2); 
            ctx.stroke();
            
            ctx.shadowBlur = 0; 

            // --- 修改文字绘制部分 ---
            // 动态计算字号：文字越长，字体越小，防止重叠 
            let dynamicFontSize = 110; 
            if (runeText.length > 20) dynamicFontSize = 80; 
            if (runeText.length > 40) dynamicFontSize = 50; 

            ctx.font = `${dynamicFontSize}px 'Ma Shan Zheng', 'STXingkai', cursive`; 
            ctx.fillStyle = mainColor; 
            ctx.textAlign = "center"; 
            ctx.textBaseline = "middle"; 
            
            ctx.shadowBlur = 15; 
            ctx.shadowColor = "#aa2200"; 

            const radius = size/2 - 170; 
            const angleStep = (Math.PI * 2) / runeText.length; 

            ctx.save(); 
            for (let i = 0; i < runeText.length; i++) { 
                const angle = i * angleStep - Math.PI/2; 
                ctx.save(); 
                ctx.translate(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius); 
                ctx.rotate(angle + Math.PI/2); 
                ctx.fillText(runeText[i], 0, 0); 
                ctx.restore(); 
            } 
            ctx.restore();

            return new THREE.CanvasTexture(canvas);
        }

        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255, 80, 0, 1)'); 
            grad.addColorStop(0.3, 'rgba(200, 40, 0, 0.8)');
            grad.addColorStop(0.6, 'rgba(100, 20, 0, 0.2)'); 
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)'); 
            
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        // === 4. 场景构建 ===

        function initThree() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 12;

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.autoClear = false;
            container.appendChild(renderer.domElement);

            spellRoot = new THREE.Group();
            scene.add(spellRoot);
            spellRoot.position.set(0, 0, 0);

            buildSpell();
            window.addEventListener('resize', onResize);
            animate();
        }

        function buildSpell() {
            const geoMat = new THREE.LineBasicMaterial({ 
                color: 0xff4400, 
                transparent: true, 
                opacity: 0, 
                blending: THREE.AdditiveBlending 
            });

            // 1. Particles
            const sparkGeo = new THREE.BufferGeometry();
            const pos = [];
            const count = 1500; 
            for(let i=0; i<count; i++) {
                const r = 2.0 * Math.cbrt(Math.random()); 
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const x = r * Math.sin(phi) * Math.cos(theta);
                const y = r * Math.sin(phi) * Math.sin(theta);
                const z = r * Math.cos(phi);
                pos.push(x, y, z * 0.8); 
            }
            sparkGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            components.sparks = new THREE.Points(sparkGeo, new THREE.PointsMaterial({
                color: 0xff3300, size: 0.25, map: createParticleTexture(),
                transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false
            }));
            
            components.sparkContainer = new THREE.Group();
            components.sparkContainer.add(components.sparks);
            spellRoot.add(components.sparkContainer);

            // 2. Inner Shapes
            components.innerShapes = [];
            const scaleFactor = 1.35; 
            
            const sqGeo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-2,-2,0), new THREE.Vector3(2,-2,0),
                new THREE.Vector3(2,2,0), new THREE.Vector3(-2,2,0),
                new THREE.Vector3(-2,-2,0)
            ].map(v => v.multiplyScalar(scaleFactor)));

            const sq1 = new THREE.Line(sqGeo, geoMat.clone());
            sq1.userData = { speed: 0.02, activationThreshold: 0.2 }; 
            components.innerShapes.push(sq1);
            spellRoot.add(sq1);

            const sq2 = new THREE.Line(sqGeo, geoMat.clone());
            sq2.rotation.z = Math.PI/4;
            sq2.userData = { speed: -0.015, activationThreshold: 0.3 };
            components.innerShapes.push(sq2);
            spellRoot.add(sq2);

            const triPts = [
                new THREE.Vector3(0,2,0), new THREE.Vector3(1.7,-1,0), new THREE.Vector3(-1.7,-1,0), new THREE.Vector3(0,2,0)
            ].map(v => v.multiplyScalar(scaleFactor));

            const tri1 = new THREE.Line(new THREE.BufferGeometry().setFromPoints(triPts), geoMat.clone());
            tri1.userData = { speed: 0.03, activationThreshold: 0.35 };
            components.innerShapes.push(tri1);
            spellRoot.add(tri1);

            const tri2 = new THREE.Line(new THREE.BufferGeometry().setFromPoints(triPts), geoMat.clone());
            tri2.rotation.z = Math.PI;
            tri2.userData = { speed: -0.025, activationThreshold: 0.4 };
            components.innerShapes.push(tri2);
            spellRoot.add(tri2);

            // 3. Rings
            for(let i=0; i<6; i++) { 
                const r = (3.2 + i * 0.9) * 1.15;
                const pts = [];
                let sides = 60; 
                let isPoly = false;
                
                if (i === 1) { sides = 4; isPoly = true; } 
                else if (i === 3) { sides = 3; isPoly = true; } 
                else if (i === 4) { sides = 5; isPoly = true; } 
                else if (i === 5) { sides = 8; isPoly = true; } 

                for(let j=0; j<=sides; j++) {
                    const t = (j/sides)*Math.PI*2;
                    pts.push(new THREE.Vector3(Math.cos(t)*r, Math.sin(t)*r, 0));
                }
                const ring = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), geoMat.clone());
                
                ring.userData = { 
                    speed: (i%2==0?1:-1) * (0.01 + Math.random()*0.04), 
                    activationThreshold: 0.45 + (i * 0.06) 
                };
                if(isPoly) ring.rotation.z = Math.random();
                
                components.rings.push(ring);
                spellRoot.add(ring);
            }

            // 4. Text Ring
            const runeGeo = new THREE.PlaneGeometry(36, 36); 
            const runeMat = new THREE.MeshBasicMaterial({ 
                map: createRuneTexture(), 
                transparent: true, 
                opacity: 0,
                side: THREE.DoubleSide,
                depthWrite: false,
                blending: THREE.NormalBlending 
            });
            components.runeRing = new THREE.Mesh(runeGeo, runeMat);
            components.runeRing.position.z = -0.5;
            components.runeRing.userData = { speed: 0.005, activationThreshold: 0.85 }; 
            spellRoot.add(components.runeRing);
        }

        // === 5. 动画与逻辑 ===

        function updateLogic() {
            if (!hasStarted) return;

            if (isEnergyLocked) {
                energy = 1;
                document.getElementById('status').innerText = "PORTAL OPENED";
                document.getElementById('status').style.color = "#ff3300";
                
                if(!hasShownAd) {
                    const ad = document.getElementById('end-ad');
                    if(ad) ad.classList.add('visible');
                    hasShownAd = true;
                }
            } else {
                // [修改] 核心逻辑：如果是 (检测到手且张开) 或者 (正在长按屏幕) 都可以充能 
                if ((isHandDetected && isHandOpen) || isLongPressing) { 
                    
                    // 如果是长按，我们模拟一个比较近的距离(0.35)，让能量涨得快一点 
                    // 如果是摄像头，就用真实的 handProximity 
                    const activeProx = isLongPressing ? 0.35 : handProximity; 

                    // [修改] 计算充能速度 
                    const proximityBonus = activeProx * 0.0008; 
                    energy += (CONFIG.energyRate + proximityBonus); 
                    
                    document.getElementById('status').innerText = "CONJURING..."; 
                    document.getElementById('status').style.color = "#ff3300"; 
                } else { 
                    energy += CONFIG.autoChargeRate; 
                    
                    // 提示文案也改一下 
                    if(!isHandDetected && !isLongPressing) document.getElementById('status').innerText = "GATHERING ENERGY..."; 
                    else document.getElementById('status').innerText = "HOLD SCREEN OR OPEN HAND"; 
                    document.getElementById('status').style.color = "#555"; 
                }

                energy = Math.max(0, Math.min(1, energy));

                if (energy >= 1.0) {
                    energy = 1.0;
                    isEnergyLocked = true;
                }
            }

            let s = 0;
            if(energy > 0.2) s=1; 
            if(energy > 0.5) s=2;
            if(energy > 0.8) s=3;
            if(energy > 0.98) s=4;
            
            if(s > currentStage) pulseScale = 0.2; 
            currentStage = s;
            pulseScale = THREE.MathUtils.lerp(pulseScale, 0, 0.1);

            if(isEnergyLocked) {
                 document.getElementById('energy-val').innerText = "MAX";
            } else {
                 document.getElementById('energy-val').innerText = (energy * 100).toFixed(1);
            }
        }

        function updateVisuals() { 
            // === 1. 计算长按加速/减速逻辑 (新增功能) === 
            if (isLongPressing) { 
                pressAcce += 0.004; // 按住时：速度逐渐增加 (0.004是加速度，数值越大起步越快) 
            } else { 
                pressAcce -= 0.003; // 松开后：速度慢慢衰减 (0.003是阻力，数值越小滑行越久) 
            } 
            // 限制 pressAcce 在 0 到 1 之间，防止速度无限增加或变成负数 
            pressAcce = Math.max(0, Math.min(1, pressAcce)); 
 
            // === 2. 确定当前的交互强度 === 
            // 手机/长按：由 pressAcce 决定，模拟一个最大 0.6 的距离 (0.6会让它转得很快) 
            const simulatedProx = pressAcce * 0.6; 
            
            // 电脑/手势：如果是电脑，同时检测手势距离和鼠标按压，取最大值 
            // 为了防止报错，先检查 isMobileDevice 是否定义，没定义就默认视为手机模式的逻辑 
            const isMobile = (typeof isMobileDevice !== 'undefined') ? isMobileDevice : (window.innerWidth < 900); 
            
            const activeDist = (!isMobile) 
                               ? Math.max(handProximity, simulatedProx) 
                               : simulatedProx; 
 
            // 计算有效距离 (减去触发阈值) 
            let effectiveDist = Math.max(0, activeDist - CONFIG.distThreshold); 
            
            // 速度公式：距离越近(或长按越久)，速度呈指数级上升 
            let speedBoost = Math.pow(effectiveDist * 2.5, 4); 
            
            // 最终速度因子 
            const speedFactor = CONFIG.minSpeed + (speedBoost * energy * 0.1); 
 
            // === 3. 应用旋转和特效 (保持原有逻辑) === 
            // 粒子系统 
            const particleScale = 1.0 + (energy * 5.5); 
            components.sparkContainer.scale.setScalar(particleScale); 
            components.sparkContainer.rotation.z -= speedFactor * 3.0; 
            // 加上一点随机摆动，增加灵动感 
            components.sparkContainer.rotation.x = Math.sin(Date.now() * 0.001) * 0.2; 
            components.sparkContainer.rotation.y = Math.cos(Date.now() * 0.0013) * 0.2; 
            
            const easeAlpha = Math.pow(energy, 3); 
            components.sparks.material.opacity = Math.min(1, easeAlpha * 4); 
 
            // 内部几何图形 
            components.innerShapes.forEach(shape => { 
                const threshold = shape.userData.activationThreshold; 
                const localEnergy = Math.max(0, energy - threshold) * 5.0; 
                const opacity = Math.min(1, localEnergy); 
                shape.material.opacity = opacity * 1.0; 
                shape.visible = opacity > 0.01; 
                shape.rotation.z += speedFactor * (shape.userData.speed / 0.01); 
            }); 
 
            // 法阵圆环 
            components.rings.forEach(ring => { 
                const threshold = ring.userData.activationThreshold; 
                const localEnergy = Math.max(0, energy - threshold) * 4.0; 
                const opacity = Math.min(1, localEnergy); 
                ring.material.opacity = opacity * 1.0; 
                ring.visible = opacity > 0.01; 
                ring.rotation.z += speedFactor * (ring.userData.speed / 0.01); 
            }); 
 
            // 文字环 
            const runeThreshold = components.runeRing.userData.activationThreshold; 
            const runeEnergy = Math.max(0, energy - runeThreshold) * 3.0; 
            const runeOpacity = Math.min(1, runeEnergy); 
            components.runeRing.material.opacity = runeOpacity; 
            components.runeRing.visible = runeOpacity > 0.01; 
            components.runeRing.rotation.z -= speedFactor * 0.5; 
 
            // === 4. 屏幕适配缩放 (上一轮做的手机适配) === 
            let baseSize = 0.8; 
 
            if (isMobile) { 
                const aspect = window.innerWidth / window.innerHeight; 
                if (aspect < 1) { 
                    // 竖屏：根据宽度动态缩放，0.55 是为了让圆环两边留出一点空隙 
                    baseSize = aspect * 0.55; 
                } else { 
                    // 横屏 
                    baseSize = 0.5; 
                } 
            } 
 
            // 整合所有缩放因素：基础大小 + 能量脉冲 + 距离拉近效果 
            const globalScale = (1.0 + pulseScale + (effectiveDist * 0.1)) * baseSize; 
            spellRoot.scale.setScalar(globalScale); 
        }
        

        function animate() {
            requestAnimationFrame(animate);
            updateLogic();
            updateVisuals();

            if (energy > 0.1) {
                renderer.autoClear = false;
                if(!window.fadeScene) {
                    window.fadeScene = new THREE.Scene();
                    const plane = new THREE.Mesh(
                        new THREE.PlaneGeometry(1000, 1000),
                        new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity: CONFIG.trailIntensity})
                    );
                    plane.position.z = -10;
                    window.fadeScene.add(plane);
                    window.fadeCam = new THREE.OrthographicCamera(-1,1,1,-1,0,100);
                }
                renderer.render(window.fadeScene, window.fadeCam);
                renderer.clearDepth();
            } else {
                renderer.clear();
            }
            renderer.render(scene, camera);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // === 6. 启动 ===
        window.startExperience = function() {
            const startDiv = document.getElementById('start-container');
            
            // 隐藏 UI 
            startDiv.style.opacity = '0'; 
            setTimeout(() => startDiv.style.display = 'none', 800); 
            document.getElementById('ui-layer').style.opacity = '1'; 
            
            hasStarted = true; 
            
            // [核心修改] 根据设备决定启动方式 
            if (isMobileDevice) { 
                // 1. 如果是手机，直接初始化 3D 场景，不开启摄像头 
                if(!scene) initThree(); 
                console.log("Mobile mode: Camera skipped. Use Long Press."); 
            } else { 
                // 2. 如果是电脑，才开启摄像头检测 
                setupMediaPipe(); 
                if(!scene) initThree(); 
            } 

            // [通用] 添加交互监听 (手机长按 / 电脑鼠标长按) 
            const addPressListeners = () => { 
                const onDown = (e) => { 
                    // 防止误触链接 
                    if(e.target.tagName !== 'A' && e.target.parentElement.tagName !== 'A') { 
                         // e.preventDefault(); 
                    } 
                    isLongPressing = true; 
                }; 
                const onUp = () => { isLongPressing = false; }; 

                // 手机触摸 
                document.addEventListener('touchstart', onDown, {passive: false}); 
                document.addEventListener('touchend', onUp); 
                
                // 电脑鼠标 (作为备用) 
                document.addEventListener('mousedown', onDown); 
                document.addEventListener('mouseup', onUp); 
            }; 

            addPressListeners(); 
        };

        function setupMediaPipe() {
            const videoElement = document.getElementsByClassName('input_video')[0];
            
            function onResults(results) {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    isHandDetected = true;
                    const hand = results.multiHandLandmarks[0];
                    const wrist = hand[0];
                    const midTip = hand[12];
                    const midPip = hand[10];
                    
                    const dWristTip = Math.hypot(midTip.x - wrist.x, midTip.y - wrist.y);
                    const dWristPip = Math.hypot(midPip.x - wrist.x, midPip.y - wrist.y);
                    
                    isHandOpen = dWristTip > dWristPip * 1.3;
                    handProximity = dWristTip; 
                } else {
                    isHandDetected = false;
                    isHandOpen = false;
                    handProximity = 0;
                }
            }

            const hands = new window.Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
            hands.onResults(onResults);
            
            const cam = new window.Camera(videoElement, { 
                onFrame: async () => await hands.send({image: videoElement}), 
                width: 1280, height: 720 
            });
            cam.start();
        }

    </script>
</body>
