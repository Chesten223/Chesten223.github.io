<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三生石 - AI命理分析</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .logo {
            font-size: 80px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        h1 {
            font-size: 36px;
            background: linear-gradient(45deg, #ffd700, #ff6b6b, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #a0a0a0;
            font-size: 14px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #ffd700;
            font-size: 14px;
        }
        
        input, select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        
        select option {
            background: #1a1a2e;
            color: #fff;
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #ffd700, #ff6b6b);
            color: #1a1a2e;
        }
        
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
        }
        
        .btn-secondary {
            background: transparent;
            border: 2px solid #ffd700;
            color: #ffd700;
            margin-top: 10px;
        }
        
        .result {
            display: none;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result.show {
            display: block;
        }
        
        .fortune-title {
            font-size: 28px;
            color: #ffd700;
            margin-bottom: 20px;
        }
        
        .fortune-content {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            text-align: left;
        }
        
        .fortune-section {
            margin-bottom: 20px;
        }
        
        .fortune-section h3 {
            color: #ff6b6b;
            font-size: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .fortune-section p {
            color: #d0d0d0;
            line-height: 1.8;
            font-size: 15px;
        }
        
        .zodiac-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        
        .lucky-colors {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        
        .color-chip {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
        }
        
        .tips {
            background: rgba(255, 215, 0, 0.1);
            border-left: 4px solid #ffd700;
            padding: 15px;
            margin-top: 20px;
            border-radius: 0 10px 10px 0;
        }
        
        .tips h4 {
            color: #ffd700;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .tips p {
            color: #a0a0a0;
            font-size: 13px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .loading.show {
            display: block;
        }
        
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 215, 0, 0.3);
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .hidden {
            display: none !important;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 12px;
        }
        
        .footer a {
            color: #ffd700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🔮</div>
            <h1>三生石</h1>
            <p class="subtitle">AI命理分析 · 探索你的三世因果</p>
        </div>
        
        <!-- Input Form -->
        <div id="inputForm" class="card">
            <div class="input-group">
                <label>你的名字</label>
                <input type="text" id="name" placeholder="输入名字">
            </div>
            
            <div class="input-group">
                <label>出生年份</label>
                <select id="year">
                    <option value="">选择年份</option>
                </select>
            </div>
            
            <div class="input-group">
                <label>出生月份</label>
                <select id="month">
                    <option value="">选择月份</option>
                    <option value="1">正月</option>
                    <option value="2">二月</option>
                    <option value="3">三月</option>
                    <option value="4">四月</option>
                    <option value="5">五月</option>
                    <option value="6">六月</option>
                    <option value="7">七月</option>
                    <option value="8">八月</option>
                    <option value="9">九月</option>
                    <option value="10">十月</option>
                    <option value="11">冬月</option>
                    <option value="12">腊月</option>
                </select>
            </div>
            
            <div class="input-group">
                <label>出生日期（农历）</label>
                <select id="day">
                    <option value="">选择日期</option>
                </select>
            </div>
            
            <button class="btn btn-primary" onclick="calculateFortune()">开始测算</button>
        </div>
        
        <!-- Loading -->
        <div id="loading" class="loading card">
            <div class="loading-spinner"></div>
            <p>命理师正在推算中...</p>
            <p style="color: #666; font-size: 12px; margin-top: 10px;">AI正在解读你的三世因果</p>
        </div>
        
        <!-- Result -->
        <div id="result" class="result card">
            <div class="zodiac-icon" id="zodiacIcon">🐲</div>
            <h2 class="fortune-title" id="fortuneTitle">命主：</h2>
            
            <div class="fortune-content">
                <div class="fortune-section">
                    <h3>📜 前世今生</h3>
                    <p id="pastLife"></p>
                </div>
                
                <div class="fortune-section">
                    <h3>💫 今生命格</h3>
                    <p id="currentLife"></p>
                </div>
                
                <div class="fortune-section">
                    <h3>🔮 来世预告</h3>
                    <p id="futureLife"></p>
                </div>
                
                <div class="fortune-section">
                    <h3>🎯 命理建议</h3>
                    <p id="advice"></p>
                </div>
                
                <div class="fortune-section">
                   💚 本 <h3>月运势</h3>
                    <p id="monthlyFortune"></p>
                </div>
            </div>
            
            <div class="tips">
                <h4>💡 温馨提示</h4>
                <p>以上仅为AI娱乐推算，仅供参考娱乐。人生掌握在自己手中，努力创造美好未来！</p>
            </div>
            
            <button class="btn btn-secondary" onclick="reset()">重新测算</button>
        </div>
        
        <div class="footer">
            <p>© 2026 三生石 | AI命理分析</p>
            <p>娱乐而已，仅供参考</p>
        </div>
    </div>
    
    <script>
        // Initialize year options
        const yearSelect = document.getElementById('year');
        const daySelect = document.getElementById('day');
        const currentYear = new Date().getFullYear();
        
        for (let y = currentYear - 80; y <= currentYear; y++) {
            const option = document.createElement('option');
            option.value = y;
            option.textContent = y + '年';
            yearSelect.appendChild(option);
        }
        
        // Initialize day options (1-30)
        for (let d = 1; d <= 30; d++) {
            const option = document.createElement('option');
            option.value = d;
            option.textContent = d + '日';
            daySelect.appendChild(option);
        }
        
        // Chinese zodiac animals
        const zodiacAnimals = ['鼠', '牛', '虎', '兔', '龙', '蛇', '马', '羊', '猴', '鸡', '狗', '猪'];
        const zodiacIcons = ['🐭', '🐮', '🐯', '🐰', '🐲', '🐍', '🐴', '🐑', '🐵', '🐔', '🐶', '🐷'];
        
        // Past life stories
        const pastLives = [
            '你是一位云游四方的道士，曾在终南山修炼多年，通晓天地之道',
            '你是一位古代的书生，寒窗苦读十年，却淡泊名利，最终归隐山林',
            '你是一位悬壶济世的郎中，救死扶伤无数，积累下深厚福报',
            '你是一位沙场将领，戎马一生，却心系百姓，留下千古美名',
            '你是一位大家闺秀，才情横溢却命运多舛，一生追求真爱',
            '你是一位隐士高人，在深山老林中悟道，追求无上智慧',
            '你是一位能工巧匠，制作出许多精美器物，深受人们喜爱',
            '你是一位商人，走南闯北，诚信经营，广结善缘'
        ];
        
        // Current life descriptions
        const currentLives = [
            '你天生具有领袖气质，善于统筹全局，但有时过于追求完美',
            '你性格温和，待人友善，但内心深处有着坚定的信念',
            '你思维敏捷，善于发现问题本质，适合从事研究类工作',
            '你情感丰富，善于表达，具有艺术天赋和创造力',
            '你稳重踏实，值得信赖，是朋友眼中的可靠伙伴',
            '你热情开朗，喜欢结交朋友，人缘极佳',
            '你内心细腻，善于观察，对人性有深刻的理解',
            '你志向远大，不甘平庸，有很强的进取心'
        ];
        
        // Future life predictions
        const futureLives = [
            '来世你将投身于科技行业，用智慧造福人类社会',
            '来世你将成为一名教育家，桃李满天下',
            '来世你将从事艺术创作，留下传世之作',
            '来世你将隐居山林，与自然和谐相处',
            '来世你将成为一名医生，救死扶伤',
            '来世你将周游世界，体验不同文化',
            '来世你将致力于环保事业，保护地球家园',
            '来世你将从事公益，帮助弱势群体'
        ];
        
        // Advice based on zodiac
        const advices = [
            '今年宜静不宜动，多学习沉淀自己。遇到困难时，保持内心平静，寻求贵人相助',
            '事业上有新的机遇，但需要耐心等待。不要急于求成，稳扎稳打更重要',
            '财运有所提升，但切记贪小便宜。投资需谨慎，三思而后行',
            '感情方面，单身者有望遇到正缘。已有伴侣者，要多沟通理解',
            '健康方面，注意作息规律，不要熬夜。多运动，保持好心情'
        ];
        
        // Monthly fortunes
        const monthlyFortunes = [
            '本月整体运势平稳，适合沉淀学习。工作上可能会有新的突破机会',
            '财运不错，会有意外收获。但要 注意防范小人，避免口舌之争',
            '事业运上升期，敢于尝试新事物。爱情运也很好，单身者有望脱单',
            '本月宜外出旅游，放松心情。财运一般，但人际关往很顺畅',
            '工作压力大，需要调整好心态。健康方面注意预防感冒'
        ];
        
        // Generate fortune based on input
        function calculateFortune() {
            const name = document.getElementById('name').value;
            const year = document.getElementById('year').value;
            const month = document.getElementById('month').value;
            const day = document.getElementById('day').value;
            
            if (!name || !year || !month || !day) {
                alert('请填写完整信息');
                return;
            }
            
            // Show loading
            document.getElementById('inputForm').classList.add('hidden');
            document.getElementById('loading').classList.add('show');
            
            // Simulate AI calculation
            setTimeout(() => {
                showResult(name, year, month, day);
            }, 2500);
        }
        
        function showResult(name, year, month, day) {
            document.getElementById('loading').classList.remove('show');
            document.getElementById('result').classList.add('show');
            
            // Calculate zodiac based on year
            const zodiacIndex = (year - 4) % 12;
            const zodiac = zodiacAnimals[zodiacIndex];
            const zodiacIcon = zodiacIcons[zodiacIndex];
            
            // Generate pseudo-random but consistent results
            const seed = year + month * 100 + day * 10000 + name.length;
            const pastIndex = seed % pastLives.length;
            const currentIndex = (seed * 2) % currentLives.length;
            const futureIndex = (seed * 3) % futureLives.length;
            const adviceIndex = (seed * 4) % advices.length;
            const monthlyIndex = (seed * 5) % monthlyFortunes.length;
            
            // Update UI
            document.getElementById('zodiacIcon').textContent = zodiacIcon;
            document.getElementById('fortuneTitle').textContent = `命主：${name}（${zodiac}年 ${month}月 ${day}日）`;
            document.getElementById('pastLife').textContent = pastLives[pastIndex];
            document.getElementById('currentLife').textContent = currentLives[currentIndex];
            document.getElementById('futureLife').textContent = futureLives[futureIndex];
            document.getElementById('advice').textContent = advices[adviceIndex];
            document.getElementById('monthlyFortune').textContent = monthlyFortunes[monthlyIndex];
        }
        
        function reset() {
            document.getElementById('result').classList.remove('show');
            document.getElementById('inputForm').classList.remove('hidden');
            document.getElementById('name').value = '';
            document.getElementById('year').value = '';
            document.getElementById('month').value = '';
            document.getElementById('day').value = '';
        }
    </script>
</body>
</html>
